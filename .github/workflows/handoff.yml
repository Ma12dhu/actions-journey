name: file 
on: push
jobs: 
 build:
   runs-on: ubuntu-latest
   steps: 
    - name: build package
      run: | 
       echo "the package" >> app.txt
    - name: upload the package
      uses: actions/upload-artifact@v4
      with: 
       name: app-package
       path: app.txt
 verify:
   needs: build
   runs-on: ubuntu-latest
   steps: 
     - name: Download the package
       uses: actions/download-artifact@v4
       with: 
        name: app-package
     - name: check it arrived
       run: test -f app.txt




