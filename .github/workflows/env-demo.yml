name: variable
on: push
env: 
 APP_NAME: journey
jobs: 
 envs:
   runs-on: ubuntu-latest
   env:
    LOG_LEVEL: info
   steps:
    - name: Debug log  level
      env:
         LOG_LEVEL: debug
      run: echo "$APP_NAME uses log level $LOG_LEVEL"
    - name: Default log level
      run: echo "$APP_NAME uses log level $LOG_LEVEL"
