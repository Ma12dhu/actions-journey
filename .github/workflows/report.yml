name: build report
on: push
jobs: 
 build_report:
   runs-on: ubuntu-latest
   steps:
     - name: Write the report
       run: | 
          echo "Build report" > report.txt
          date >> report.txt
          uname -a >> report.txtx
     - name: upload the report
       uses: actions/upload-artifact@v4
       with:
         name: build-report
         path: report.txt    
         retention-days: 5 

